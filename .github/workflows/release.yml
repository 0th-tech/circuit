name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make proof
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes target/login.json target/vk target/proof target/public_inputs
        env:
          GH_TOKEN: ${{ github.token }}
