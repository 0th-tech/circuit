name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The setup's single contribution comes from this runner, so the release is for testnets only
      - run: make release
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes target/release/*
        env:
          GH_TOKEN: ${{ github.token }}
